\* TLC 配置：修复流水线的安全红线模型（3 个条目，2 个潜在冲突目标）
SPECIFICATION Spec

INVARIANTS
  SourceIntact
  NoOverwrite
  DryRunPure
  NoUfffdGuess
  AllFixedUtf8Flagged
  DistinctTargets
  DoneImpliesVerified

\* 流水线终态 "done" 之后没有使能的动作，属于合法停止；
\* 关闭死锁检测以免把终态误报为死锁。
CHECK_DEADLOCK FALSE

CONSTANT
  Entries = {1, 2, 3}
  PreExisting = {2}
  FffdEntries = {3}
  FingerprintOk = {}
  BuildFixedZip = TRUE
  FixedZipTaken = TRUE
